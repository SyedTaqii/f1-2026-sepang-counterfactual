# Every assumption and magic number lives here. Keys are added milestone by milestone.

race:
  year: 2026
  round: 16                         # load by round, not by name: the "Bahrain GP" was held at Sepang
  session: R
  expected_location: Kuala Lumpur   # FastF1's name for Sepang; load_session asserts it
  first_racing_lap: 3               # laps 1-2 were behind the SC, then a standing start (race control: "STANDING START", lap 2)
  leaders_n: 5                      # "the leaders" = top N on inters at first_racing_lap; they define the crossover lap and the inter-pace reference

cache_dir: cache

drivers:
  target: HAM
  teammate: LEC

fact_check:
  position_laps: [1, 3, 4, 8, 12, 13, 22, 55]   # laps at which to report the target's running position
  timing_tolerance_s: 1.0           # flag drivers whose FastF1 finish gap differs from the official one by more than this

pace:
  dry_fit_start_lap: 17             # field median lap time falls 109.4 -> 103.5 s over laps 13-16 (track still drying), then flattens
  traffic_gap_s: 1.0                # a lap is in traffic if any car crossed the line less than this ahead
  wet_sc_wear: 0.0                  # tyre wear of a wet or neutralised lap, as a fraction of a green dry lap (0 = none, 1 = raw TyreLife)
  stint_pace: true                  # the target's dry pace is fitted per tyre stint (D-029); false = one pace for the whole race (M2-M5)
  proxy_weight: 0.5                 # inter pace = w * proxy (via LEC) + (1-w) * ratio (HAM dry gap scaled); sigma covers the gap between them either way

pit_loss:
  ref_window: 5                     # green stops: the driver's clean laps within this many laps of the stop set the reference pace

start:
  comparable_grid_max: 8            # inter starters from grid P1..this are "comparable" for the standing-start gap

data_fixes:
  timing_offset_from_lap: {LEC: 1}  # FastF1 has LEC's lap timing ~19.4 s late on every lap: his GPS line crossings sit 19.4 s earlier than the field's on all laps and match the official result (D-010). The shift = his timing gap minus the official gap

sim:
  pass_cost_s: null                 # time per car caught on a green lap (passed or not). null = measured from the other drivers (pace_model.traffic_costs); a number overrides it (0 = PRD default: free passing)
  dirty_air_s: null                 # time lost on a green lap that ends within pace.traffic_gap_s of a car ahead. null = measured with the pass cost; a number overrides it

backtest:
  start_lap: 8                      # the ghost takes over from HAM's real state at the end of this lap; laps 3-8 were slicks on a wet track, which the model can't predict (D-005)
  check_lap: 42                     # last green lap before the late VSC/SC, which resets the gaps (D-006)
  tolerance_s: 5.0                  # PRD: the replay must be within +/- this of HAM's real time, at check_lap and at the flag

counterfactual:
  crossover_lap: 9                  # the ghost pits from inters to slicks at the end of this lap, under the SC with the leaders (D-012); after it, the target's real dry stints

monte_carlo:
  n: 10000
  seed: 16                          # fixed, so every number in the README reproduces
  results_path: outputs/results.json
  report_laps: {end_of_wet_phase: 8, after_lap9_stop: 10, restart: 12, before_late_sc: 42}   # position distributions saved for these laps
  fixed:                            # null = sampled every draw (the default); a number pins that input in every draw (the tornado uses these)
    inter_offset_s: null            # inter pace vs the leaders' median inter lap, s/lap (sampled: Normal(mu, sigma), M2)
    start_gap_s: null               # gap to the leader after the standing start (sampled: bootstrap of the comparable inter starters)
    green_pit_loss_s: null          # (sampled: bootstrap of the other drivers' green stops)
  dry_pace_offset_s: 0.0            # added to every dry lap of the target, in both strategies (a what-if knob for the tornado)

sensitivity:
  n: 1000                           # draws per tornado run; every run uses the same seed, so the bars are not sampling noise
  tornado:                          # one assumption at a time to its low and high value; bar = change in expected finishing position (inters)
    # sampled inputs pinned at roughly their 10th / 90th percentile (tornado() refuses ranges that miss the measured value)
    - {key: monte_carlo.fixed.inter_offset_s, low: -0.48, high: 0.63, label: "Inter pace vs leaders (s/lap)"}       # Normal(0.08, 0.43)
    - {key: monte_carlo.dry_pace_offset_s, low: -0.37, high: 0.37, label: "Dry pace (s/lap)"}                     # soft intercept se 0.29
    - {key: monte_carlo.fixed.start_gap_s, low: 0.0, high: 5.14, label: "Standing-start gap (s)"}                 # best / worst real starter
    - {key: monte_carlo.fixed.green_pit_loss_s, low: 24.4, high: 30.3, label: "Green pit loss (s)"}                 # P10 / P90 of 27 stops
    - {key: sim.pass_cost_s, low: 0.72, high: 1.06, label: "Pass cost (s)"}                                       # 0.89 +/- 1.28 se
    - {key: sim.dirty_air_s, low: 0.59, high: 0.84, label: "Dirty air (s/lap)"}                                   # 0.71 +/- 1.28 se
    # modelling choices
    - {key: pace.proxy_weight, low: 0.0, high: 1.0, label: "Inter method (ratio / LEC proxy)"}                    # D-014
    - {key: counterfactual.crossover_lap, low: 8, high: 10, label: "Lap he pits for slicks"}                      # D-012: 8 = a lap before the SC
    - {key: pace.wet_sc_wear, low: 0.0, high: 1.0, label: "Tyre wear on wet/SC laps"}                             # D-016

repeat:
  driver: LEC                       # PRD: repeat the counterfactual for the teammate; he ran inters himself, so his own laps replace the proxy

replay:                             # the race replay: real GPS for the field, the central inters run as a ghost (D-028)
  hz: 2                             # GPS samples per second kept (FastF1 has about 3.8); 2 keeps the page near 2 MB
  html: outputs/race_replay.html
  gif: outputs/race_replay.gif
  gif_fps: 8
  gif_segments:                     # the key moments for the README; speed = race seconds per GIF second
    - {label: "Lap 3: the standing start, the ghost on inters", from_lap: 3, to_lap: 5, speed: 30}
    - {label: "Lap 9: everyone pits under the safety car", from_lap: 9, to_lap: 12, speed: 40}
    - {label: "Laps 52-55: the restart sprint", from_lap: 52, to_lap: 55, speed: 30}
