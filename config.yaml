# Every assumption and magic number lives here. Keys are added milestone by milestone.

race:
  year: 2026
  round: 16                         # load by round, not by name: the "Bahrain GP" was held at Sepang
  session: R
  expected_location: Kuala Lumpur   # FastF1's name for Sepang; load_session asserts it
  first_racing_lap: 3               # laps 1-2 were behind the SC, then a standing start (race control: "STANDING START", lap 2)
  leaders_n: 5                      # "the leaders" = top N on inters at first_racing_lap; they define the crossover lap and the inter-pace reference

cache_dir: cache

drivers:
  target: HAM
  teammate: LEC

fact_check:
  position_laps: [1, 3, 4, 8, 12, 13, 22, 55]   # laps at which to report the target's running position
  timing_tolerance_s: 1.0           # flag drivers whose FastF1 finish gap differs from the official one by more than this

pace:
  dry_fit_start_lap: 17             # field median lap time falls 109.4 -> 103.5 s over laps 13-16 (track still drying), then flattens
  traffic_gap_s: 1.0                # a lap is in traffic if any car crossed the line less than this ahead
  wet_sc_wear: 0.0                  # tyre wear of a wet or neutralised lap, as a fraction of a green dry lap (0 = none, 1 = raw TyreLife)
  proxy_weight: 0.5                 # inter pace = w * proxy (via LEC) + (1-w) * ratio (HAM dry gap scaled); sigma covers the gap between them either way

pit_loss:
  ref_window: 5                     # green stops: the driver's clean laps within this many laps of the stop set the reference pace

start:
  comparable_grid_max: 8            # inter starters from grid P1..this are "comparable" for the standing-start gap

data_fixes:
  timing_offset_from_lap: {LEC: 48} # FastF1 has LEC ~19.5 s late from this lap (48 and 51 have no LapTime; his Position drops to P16-19 under the SC). The shift = his timing gap minus the official gap

sim:
  pass_cost_s: null                 # time per car caught on a green lap (passed or not). null = measured from the other drivers (pace_model.traffic_costs); a number overrides it (0 = PRD default: free passing)
  dirty_air_s: null                 # time lost on a green lap that ends within pace.traffic_gap_s of a car ahead. null = measured with the pass cost; a number overrides it

backtest:
  start_lap: 8                      # the ghost takes over from HAM's real state at the end of this lap; laps 3-8 were slicks on a wet track, which the model can't predict (D-005)
  check_lap: 42                     # last green lap before the late VSC/SC, which resets the gaps (D-006)
  tolerance_s: 5.0                  # PRD: the replay must be within +/- this of HAM's real time, at check_lap and at the flag
